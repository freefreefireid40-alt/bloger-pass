
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Vault</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f0c20;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: #1a1638;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* হেডার ও নেভিগেশন ট্যাব */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            background: #13102b;
            padding: 12px;
            border-radius: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            background: #6c5ce7;
            padding: 8px;
            border-radius: 8px;
            display: flex;
        }

        .brand-title h2 {
            font-size: 16px;
            font-weight: 600;
        }

        .brand-title p {
            font-size: 10px;
            color: #a0a0a0;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: #a0a0a0;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: #4834d4;
            color: #fff;
        }

        /* কার্ড স্টাইল */
        .card {
            background: #13102b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .admin-box {
            text-align: center;
        }

        .admin-icon {
            background: rgba(108, 92, 231, 0.2);
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            color: #a29bfe;
        }

        .admin-box h3 {
            font-size: 20px;
            margin-bottom: 6px;
        }

        .admin-box p {
            font-size: 13px;
            color: #a0a0a0;
            margin-bottom: 20px;
        }

        /* ইনপুট ও বাটন */
        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #1a1638;
            color: #fff;
            font-size: 14px;
            margin-bottom: 16px;
            outline: none;
        }
